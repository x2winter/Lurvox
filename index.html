<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030712">

<title>LURVOX • Security Service</title>
<!-- Font & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Cloudflare Turnstile Script -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
:root {
    --primary: #00f0ff;
    --primary-glow: rgba(0, 240, 255, 0.35);
    --bg: #030712;
    --card-bg: rgba(15, 23, 42, 0.65);
    --card-border: rgba(255, 255, 255, 0.08);
    --input-bg: rgba(2, 6, 23, 0.8);
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --success: #10b981;
    --error: #ef4444;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background-color: var(--bg);
    background-image: 
        radial-gradient(at 0% 0%, rgba(0, 240, 255, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    flex-direction: column;
}

/* Header Navbar */
.navbar {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8%;
    background: rgba(3, 7, 18, 0.8);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--card-border);
    position: sticky;
    top: 0;
    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--text-main);
}

.brand-icon {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 50%;
    background: #000;
    border: 1px solid var(--card-border);
}

.brand-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.brand span { color: var(--primary); }

.status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.2);
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: var(--success);
}

.dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 10px var(--success);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: scale(0.95); opacity: 0.8; }
    50% { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(0.95); opacity: 0.8; }
}

/* Main Layout */
.main-container {
    flex: 1;
    width: 90%;
    max-width: 950px;
    margin: 40px auto;
}

.hero {
    text-align: center;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 800;
    background: linear-gradient(135deg, #fff 30%, var(--primary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
}

.hero p {
    color: var(--text-muted);
    font-size: 14px;
}

/* Card Section */
.card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.upload-zone {
    border: 2px dashed rgba(255, 255, 255, 0.15);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    background: rgba(255,255,255,0.02);
    cursor: pointer;
    transition: 0.2s ease;
    margin-bottom: 16px;
}

.upload-zone:hover {
    border-color: var(--primary);
    background: rgba(0, 240, 255, 0.03);
}

.upload-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.upload-label input { display: none; }

.editor {
    width: 100%;
    min-height: 280px;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 18px;
    color: #38bdf8;
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    line-height: 1.6;
    outline: none;
    resize: vertical;
    transition: 0.2s ease;
}

.editor:focus {
    border-color: var(--primary);
    box-shadow: 0 0 15px var(--primary-glow);
}

.editor-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    color: var(--text-muted);
    font-size: 12px;
}

.btn-clear {
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    transition: 0.2s;
}

.btn-clear:hover { color: var(--error); }

/* Cloudflare Turnstile Box */
.cf-turnstile-container {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}

/* Action Button */
.btn-submit {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), #2563eb);
    color: #000;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.btn-submit:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px var(--primary-glow);
}

.btn-submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Status Banner */
.status-box {
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--card-border);
    color: var(--text-muted);
}

.status-box.success {
    background: rgba(16, 185, 129, 0.1);
    border-color: rgba(16, 185, 129, 0.3);
    color: var(--success);
}

.status-box.error {
    background: rgba(239, 68, 68, 0.1);
    border-color: rgba(239, 68, 68, 0.3);
    color: var(--error);
}

/* Result Box */
.result-container {
    display: none;
    margin-top: 24px;
    padding: 20px;
    background: var(--input-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
}

.result-container.show { display: block; }

.result-group {
    margin-bottom: 16px;
}

.result-group:last-child { margin-bottom: 0; }

.result-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 6px;
}

.script-id-val {
    font-family: 'Fira Code', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--primary);
}

.input-copy-group {
    display: flex;
    gap: 8px;
}

.result-input {
    flex: 1;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text-main);
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    outline: none;
}

.btn-copy {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--card-border);
    color: #fff;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.btn-copy:hover {
    background: var(--primary);
    color: #000;
}

footer {
    text-align: center;
    padding: 20px;
    color: var(--text-muted);
    font-size: 12px;
    border-top: 1px solid var(--card-border);
}

@media(max-width: 640px) {
    .navbar { padding: 0 5%; }
    .card { padding: 18px; }
    .input-copy-group { flex-direction: column; }
    .btn-copy { padding: 10px; }
}
</style>
</head>

<body>

<nav class="navbar">
    <a href="/" class="brand">
        <div class="brand-icon">
            <!-- เปลี่ยน URL รูปภาพโลโก้ของคุณตรงนี้ -->
            <img src="/logo.png" alt="Lurvox Logo">
        </div>
        LURVOX<span>PROJECT</span>
    </a>
    <div class="status-badge">
        <div class="dot"></div> ONLINE
    </div>
</nav>

<main class="main-container">

    <div class="hero">
        <h1>Lua Obfuscator Service</h1>
        <p>ยกระดับความปลอดภัยให้สคริปต์ของคุณด้วยระบบป้องกันและตรวจสอบ Cloudflare</p>
    </div>

    <div class="card">
        <div class="upload-zone">
            <label class="upload-label">
                <i class="fa-solid fa-file-arrow-up" style="font-size: 18px; color: var(--primary);"></i>
                <span>อัปโหลดไฟล์ Script (.txt, .lua)</span>
                <input type="file" id="fileInput" accept=".txt,.lua" onchange="loadScriptFile(event)">
            </label>
        </div>

        <textarea
            id="scriptInput"
            class="editor"
            spellcheck="false"
            placeholder="-- วางสคริปต์ Lua ของคุณที่นี่..."
        ></textarea>

        <div class="editor-footer">
            <span id="counter">0 ตัวอักษร</span>
            <button class="btn-clear" onclick="clearScript()"><i class="fa-solid fa-trash"></i> ล้างข้อมูล</button>
        </div>

        <!-- Cloudflare Turnstile Verification -->
        <div class="cf-turnstile-container">
            <div class="cf-turnstile" data-sitekey="YOUR_CLOUDFLARE_SITE_KEY" data-callback="onTurnstileSuccess"></div>
        </div>

        <button id="createButton" class="btn-submit" onclick="createScript()">
            <i class="fa-solid fa-bolt"></i> Obfuscate & Create Script
        </button>

        <div id="status" class="status-box">
            <i class="fa-solid fa-circle-info"></i> สถานะ: พร้อมใช้งาน
        </div>

        <div id="result" class="result-container">
            <div class="result-group">
                <div class="result-label">SCRIPT ID</div>
                <div id="scriptId" class="script-id-val">------</div>
            </div>

            <div class="result-group">
                <div class="result-label">RAW URL</div>
                <div class="input-copy-group">
                    <input id="scriptUrl" class="result-input" readonly>
                    <button class="btn-copy" onclick="copyText('scriptUrl', 'คัดลอก Raw URL เรียบร้อย')">คัดลอก</button>
                </div>
            </div>

            <div class="result-group">
                <div class="result-label">LOADSTRING</div>
                <div class="input-copy-group">
                    <input id="loadstringUrl" class="result-input" readonly>
                    <button class="btn-copy" onclick="copyText('loadstringUrl', 'คัดลอก Loadstring เรียบร้อย')">คัดลอก</button>
                </div>
            </div>
        </div>
    </div>

</main>

<footer>
    © 2026 LURVOX • Script Management System
</footer>

<script>
const API_URL = "/api/obfuscate";
let cfToken = "";

const scriptInput = document.getElementById("scriptInput");
const counter = document.getElementById("counter");
const createButton = document.getElementById("createButton");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const scriptId = document.getElementById("scriptId");
const scriptUrl = document.getElementById("scriptUrl");
const loadstringUrl = document.getElementById("loadstringUrl");

scriptInput.addEventListener("input", updateCounter);

function updateCounter() {
    counter.textContent = scriptInput.value.length.toLocaleString() + " ตัวอักษร";
}

function onTurnstileSuccess(token) {
    cfToken = token;
}

function loadScriptFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        scriptInput.value = e.target.result;
        updateCounter();
        setStatus("โหลดไฟล์ " + file.name + " สำเร็จ", "success");
    };
    reader.onerror = function() {
        setStatus("อ่านไฟล์ไม่สำเร็จ", "error");
    };
    reader.readAsText(file);
    event.target.value = "";
}

function clearScript() {
    scriptInput.value = "";
    updateCounter();
    resultBox.classList.remove("show");
    setStatus("พร้อมใช้งาน");
}

function setStatus(message, type = "") {
    statusBox.className = "status-box " + type;
    const icon = type === "success" ? "fa-circle-check" : type === "error" ? "fa-circle-xmark" : "fa-circle-info";
    statusBox.innerHTML = `<i class="fa-solid ${icon}"></i> สถานะ: ${message}`;
}

async function createScript() {
    const source = scriptInput.value.trim();

    if (!source) {
        setStatus("กรุณาใส่ Lua Script ก่อน", "error");
        scriptInput.focus();
        return;
    }

    createButton.disabled = true;
    createButton.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลัง Obfuscate...`;
    resultBox.classList.remove("show");
    setStatus("กำลังประมวลผล Script...");

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                source: source,
                cfToken: cfToken,
                settings: {
                    encryptStrings: true,
                    proxifyLocals: true,
                    proxifyFunctions: true,
                    antiTamper: true,
                    controlFlowFlattening: true,
                    isLuauRuntime: true,
                    loaderVMDepth: 0
                }
            })
        });

        const text = await response.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error(text || "Invalid API response");
        }

        if (!response.ok || data.status !== "success") {
            throw new Error(data.message || "Obfuscation failed");
        }

        scriptId.textContent = data.id || "Unknown";
        scriptUrl.value = data.rawUrl || "";
        loadstringUrl.value = data.loadstring || "";

        resultBox.classList.add("show");
        setStatus("สร้าง Script สำเร็จ!", "success");

    } catch (error) {
        console.error(error);
        setStatus(error.message, "error");
    } finally {
        createButton.disabled = false;
        createButton.innerHTML = `<i class="fa-solid fa-bolt"></i> Obfuscate & Create Script`;
    }
}

async function copyText(elementId, successMessage) {
    const input = document.getElementById(elementId);
    if (!input.value) return;

    try {
        await navigator.clipboard.writeText(input.value);
    } catch {
        input.select();
        document.execCommand("copy");
    }
    setStatus(successMessage, "success");
}

updateCounter();
</script>

</body>
</html>
