<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loadstring</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #191b30;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* UI เล็กลง */
.container {
    width: 82%;
    max-width: 350px;
}

/* ================= BRAND ================= */

.brand-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
}

.brand-logo {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    object-fit: cover;
}

.brand-text {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #ffffff;
}

/* ================= TITLE ================= */

.title {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 6px;
    margin-bottom: 14px;
}

.title .icon {
    font-size: 19px;
}

.title h1 {
    font-size: 21px;
    font-weight: 700;
}

/* ================= CODE ================= */

.code-box {
    position: relative;

    width: 100%;
    height: 100px;

    background: #0d101f;

    border: 1px solid #22263c;
    border-radius: 13px;

    padding: 17px 13px;

    overflow: hidden;
}

.code-scroll {
    width: 100%;
    height: 100%;

    overflow-x: auto;
    overflow-y: hidden;

    scrollbar-width: none;
}

.code-scroll::-webkit-scrollbar {
    display: none;
}

pre {
    width: max-content;

    white-space: pre;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size: 11px;
    line-height: 1.75;

    color: #d7d9e3;
}

/* ================= COLORS ================= */

.variable {
    color: #d7d9e3;
}

.function {
    color: #55a5dc;
}

.string {
    color: #c99a86;
}

.comment {
    color: #70a85b;
}

/* ================= COPY ================= */

.copy-btn {
    position: absolute;

    top: 7px;
    right: 7px;

    padding: 6px 10px;

    border: none;
    border-radius: 9px;

    background: #282d52;
    color: #eee;

    font-size: 11px;

    cursor: pointer;

    z-index: 10;
}

.copy-btn:active {
    transform: scale(.95);
}

/* ================= INFO ================= */

.info {
    text-align: center;

    margin-top: 11px;

    color: #dedee5;

    font-size: 11px;
    line-height: 1.5;
}

.info-url {
    color: #dedee5;
}

/* ================= MOBILE ================= */

@media(max-width:600px) {

    .container {
        width: 80%;
        max-width: 340px;
    }

    .brand-logo {
        width: 20px;
        height: 20px;
    }

    .brand-text {
        font-size: 15px;
    }

    .title h1 {
        font-size: 20px;
    }

    .title .icon {
        font-size: 18px;
    }

    .code-box {
        height: 98px;
    }

    pre {
        font-size: 11px;
    }

    .info {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand-header">
        <img src="https://i.postimg.cc/jqP0GjCB/lurvox-logo.png" alt="Lurvox Logo" class="brand-logo">
        <span class="brand-text">LURVOX</span>
    </div>

    <div class="title">
        <span class="icon">📜</span>
        <h1>Loadstring</h1>
    </div>

    <div class="code-box">

        <button
            class="copy-btn"
            id="copyButton"
            onclick="copyCode()">
            Copy
        </button>

        <div class="code-scroll">
            <pre id="code"></pre>
        </div>

    </div>

    <div class="info">
        This code is protected by lurvox •<br>
        <span class="info-url">https://lurvox-security.vercel.app</span>
    </div>

</div>

<script>

const currentUrl = window.location.href;

const codeHTML =
`<span class="variable">script_key</span> = <span class="string">"KEY"</span>;
<span class="function">loadstring</span>(game:<span class="function">HttpGet</span>(<span class="string">"${currentUrl}"</span>))()`;

document.getElementById("code").innerHTML = codeHTML;

function copyCode() {

    const text =
`-- // Lurvox_Security_Service";
loadstring(game:HttpGet("${currentUrl}"))()`;

    navigator.clipboard.writeText(text);

    const button =
        document.getElementById("copyButton");

    button.innerText = "Copied!";

    setTimeout(() => {
        button.innerText = "Copy";
    }, 1200);
}

</script>

</body>
</html>
